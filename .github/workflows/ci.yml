name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 单元测试 + 集成用例(自己起假 ComfyUI 的真 HTTP 服务,不需要显卡/ComfyUI/网络)
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
