name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 代码渲染用的 HyperFrames CLI:按 apps/host/hyperframes/package-lock.json 装(npm ci,不跑安装脚本)
      - name: Install locked HyperFrames
        run: pnpm hyperframes:install

      - name: Typecheck
        run: pnpm typecheck

      # ffmpeg 一律用清单锁定的 LGPL 构建(剪辑工具用它;不装 choco 的 GPL 版):按清单下载 + sha256 校验 + 解压到默认数据目录,
      # 再把它的 bin 加进 PATH —— 假 ComfyUI 回放出占位视频、测试里直接调的 ffprobe 也都用这一份
      - name: Fetch locked LGPL ffmpeg
        shell: pwsh
        run: |
          $out = @(pnpm --silent ffmpeg:fetch)
          if ($LASTEXITCODE -ne 0) { $out | Write-Host; throw 'ffmpeg:fetch 失败' }
          $out | Write-Host
          $bin = ($out | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          if (-not (Test-Path (Join-Path $bin 'ffmpeg.exe'))) { throw "找不到 $bin\ffmpeg.exe" }
          $bin >> $env:GITHUB_PATH

      # 验收②:PATH 上的 ffmpeg 就是上一步那份,configuration 行里没有 --enable-gpl
      - name: ffmpeg -version has no --enable-gpl
        shell: pwsh
        run: |
          Write-Host "ffmpeg: $((Get-Command ffmpeg).Source)"
          $cfg = (ffmpeg -hide_banner -version | Select-String '^configuration:').Line
          Write-Host $cfg
          if (-not $cfg) { throw 'ffmpeg -version 里没有 configuration 行' }
          if ($cfg -split '\s+' -contains '--enable-gpl') { throw 'PATH 上的 ffmpeg 是 --enable-gpl 构建' }
          Write-Host 'OK: configuration 行里没有 --enable-gpl'

      # 单元测试;其中真实调用 nvidia-smi 的用例在无显卡的 CI 上应判 none;
      # 作业对象内存护栏(comfyui-memory-guard.test.ts)只在这里(Windows)真跑
      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      # 不给 key 启动 Host,页面提示去设置、预设工作流入口可见
      - name: E2E (no key)
        run: pnpm test:e2e

      # 「启动 / 打开 ComfyUI」,用假 ComfyUI(Python 标准库)
      - name: E2E (ComfyUI panel, fake ComfyUI)
        run: pnpm exec playwright test --project=comfyui

      # 验收①的 CI 版:假 LLM 回放录好的 render_motion 调用 → 按清单下载 chrome-headless-shell(sha256 校验)→
      # HyperFrames 逐帧渲染 → LGPL ffmpeg 编码 → 自检 → 入库;ffprobe 量 10 秒、联系表在作品目录
      - name: E2E (code-rendered video, real browser download + HyperFrames render)
        run: pnpm exec playwright test --project=motion

      - name: Upload code-render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-e2e
          path: test-results/
          if-no-files-found: ignore

      - name: Host listens on 127.0.0.1 only
        shell: pwsh
        working-directory: apps/host
        run: |
          $env:VIDROOM_PORT = '47123'
          Remove-Item Env:VIDROOM_DEEPSEEK_KEY_FILE -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath node -ArgumentList '--import','tsx','src/main.ts' -PassThru -NoNewWindow
          try {
            $conns = $null
            for ($i = 0; $i -lt 30 -and -not $conns; $i++) {
              Start-Sleep -Seconds 1
              $conns = Get-NetTCPConnection -State Listen -LocalPort 47123 -ErrorAction SilentlyContinue
            }
            if (-not $conns) { throw 'Host 没有在 47123 端口监听' }
            $conns | Format-Table LocalAddress, LocalPort, OwningProcess
            $bad = $conns | Where-Object { $_.LocalAddress -ne '127.0.0.1' }
            if ($bad) { throw "Host 监听了非 127.0.0.1 地址: $($bad.LocalAddress -join ', ')" }
            $code = (Invoke-WebRequest -Uri http://127.0.0.1:47123/api/status -SkipHttpErrorCheck).StatusCode
            if ($code -ne 401) { throw "不带 cookie 的 /api/status 应为 401,实际 $code" }
            Write-Host "OK: 只听 127.0.0.1,不带 cookie 的 API 请求返回 401"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

  # 桌面版:打未签名 NSIS 安装包 → /S 静默安装 → Playwright 驱动装好的 VidRoom.exe 跑端到端
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 安装包带上 HyperFrames CLI 和它的 node_modules(resources/hyperframes)
      - name: Install locked HyperFrames
        run: pnpm hyperframes:install

      - name: Package NSIS installer
        run: pnpm --filter @vidroom/desktop dist --win --x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VidRoom-Setup
          path: apps/desktop/release/VidRoom-Setup-*.exe
          if-no-files-found: error

      - name: Silent install (/S) into current user, no HKLM
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/VidRoom-Setup-*.exe | Select-Object -First 1
          Write-Host "安装包: $($setup.Name) ($($setup.Length) 字节)"

          # 安装包清单里要求的权限级别:asInvoker = 不要求管理员
          $manifest = [regex]::Match([Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($setup.FullName)), 'requestedExecutionLevel\s+level="(\w+)"')
          Write-Host "requestedExecutionLevel = $($manifest.Groups[1].Value)"
          if ($manifest.Groups[1].Value -ne 'asInvoker') { throw "安装包要求的权限级别不是 asInvoker" }

          $uninstallPaths = @(
            'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          function Find-VidRoomUninstallKeys([string]$hive) {
            foreach ($p in $uninstallPaths) {
              Get-ChildItem "${hive}:\$p" -ErrorAction SilentlyContinue |
                Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -like 'VidRoom*' }
            }
          }
          if (Find-VidRoomUninstallKeys 'HKLM') { throw '安装前 HKLM 里就已经有 VidRoom,环境不干净' }

          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装退出码 $($p.ExitCode)" }

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\VidRoom'
          $appExe = Join-Path $installDir 'VidRoom.exe'
          if (-not (Test-Path $appExe)) { throw "没有装到当前用户目录: $appExe 不存在" }
          Write-Host "OK: 装在当前用户目录 $installDir"
          Get-ChildItem $installDir | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $installDir 'resources\host\host.mjs'))) { throw 'Host 没有打进安装包' }
          if (-not (Test-Path (Join-Path $installDir 'resources\web\index.html'))) { throw '聊天页没有打进安装包' }
          if (-not (Test-Path (Join-Path $installDir 'resources\bin\7za.exe'))) { throw '解压 ComfyUI 便携包用的 7za.exe 没有打进安装包' }
          if (-not (Test-Path (Join-Path $installDir 'resources\hyperframes\node_modules\hyperframes\bin\hyperframes.mjs'))) { throw 'HyperFrames 没有打进安装包' }

          $hkcu = @(Find-VidRoomUninstallKeys 'HKCU')
          if ($hkcu.Count -ne 1) { throw "HKCU 里的 VidRoom 卸载项应为 1 个,实际 $($hkcu.Count)" }
          $guid = $hkcu[0].PSChildName
          Get-ItemProperty $hkcu[0].PSPath | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString
          $hklm = @(Find-VidRoomUninstallKeys 'HKLM')
          if ($hklm.Count -ne 0) { throw "HKLM 里出现了 VidRoom 卸载项: $($hklm.Name -join ', ')" }
          foreach ($k in @("HKLM:\SOFTWARE\$guid", "HKLM:\SOFTWARE\WOW6432Node\$guid", 'HKLM:\SOFTWARE\VidRoom', 'HKLM:\SOFTWARE\WOW6432Node\VidRoom')) {
            if (Test-Path $k) { throw "HKLM 里出现了 $k" }
          }
          Write-Host "OK: 卸载项只在 HKCU($guid),HKLM 里没有 VidRoom 的键"

          "VIDROOM_DESKTOP_EXE=$appExe" >> $env:GITHUB_ENV
          "VIDROOM_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

      # Electron 不用另装浏览器;驱动的是上一步装好的 VidRoom.exe
      - name: E2E desktop (Playwright drives installed VidRoom.exe)
        run: pnpm exec playwright test --project=desktop

      # 装好的 VidRoom.exe 以 ELECTRON_RUN_AS_NODE=1 跑安装包里的 host.mjs,用安装包里的 HyperFrames 渲染同一条 10 秒开场动画
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E code-rendered video via installed VidRoom.exe (Electron as Node)
        shell: pwsh
        run: |
          $env:VIDROOM_E2E_ELECTRON = $env:VIDROOM_DESKTOP_EXE
          $env:VIDROOM_E2E_HOST_SCRIPT = Join-Path $env:VIDROOM_INSTALL_DIR 'resources\host\host.mjs'
          $env:VIDROOM_E2E_HYPERFRAMES_DIR = Join-Path $env:VIDROOM_INSTALL_DIR 'resources\hyperframes'
          $env:VIDROOM_E2E_WEB_DIR = Join-Path $env:VIDROOM_INSTALL_DIR 'resources\web'
          pnpm exec playwright test --project=motion

      - name: No VidRoom process left
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          $left = Get-Process -Name VidRoom -ErrorAction SilentlyContinue
          $left | Format-Table Id, ProcessName, Path
          if ($left) { throw "还有 $($left.Count) 个 VidRoom 进程没退出" }
          Write-Host 'OK: Get-Process 里没有 VidRoom 进程'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

  # 真 ComfyUI:从官方 Release 下载 NVIDIA 便携包(中途主动断一次再续传)→ sha256 与清单比对 → 解压 →
  # 查便携包自带 PyTorch 的 CUDA 版本 → --cpu 起停(/system_stats、只听 127.0.0.1、停后 30 秒内无残留)
  comfyui:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 便携包下载与解压的数据目录(job 级 env 里用不了 runner 上下文,这里写进 GITHUB_ENV)
      - name: Set data dir
        shell: pwsh
        run: |
          "VIDROOM_DATA_DIR=$(Join-Path $env:RUNNER_TEMP 'vidroom-data')" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 一条脚本做完:下载(100 MiB 处主动中断再续传)、校验、解压、torch.version.cuda、--cpu 起停与监听地址、残留检查
      - name: Download portable, resume, verify, start with --cpu, stop
        env:
          # 起不来时每 120 秒把 ComfyUI 所有线程的调用栈打进日志,便于排查卡在哪
          VIDROOM_COMFYUI_DUMP_STACKS_AFTER: '120'
        run: pnpm comfyui:smoke -- --interrupt-download-at 104857600 --cpu

      - name: No ComfyUI python process left (Get-Process)
        shell: pwsh
        run: |
          $root = $env:VIDROOM_DATA_DIR
          $left = Get-Process -Name python* -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($root) }
          Get-Process -Name python* -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path
          if ($left) { throw "还有 $($left.Count) 个便携包里的 python 进程没退出" }
          Write-Host "OK: 没有 $root 下的 python 进程"

      # 同一份真便携包走完整 Host:页面点「启动 ComfyUI」→「打开 ComfyUI」弹出页地址是 127.0.0.1:<端口>;
      # 停 Host 在 Windows 上是强杀,ComfyUI 要靠 stdin 断开自己退出,30 秒内不残留
      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E (ComfyUI panel, real portable ComfyUI --cpu)
        shell: pwsh
        run: |
          $top = Join-Path $env:VIDROOM_DATA_DIR 'runtime\comfyui-portable-0.38.0\ComfyUI_windows_portable'
          $env:VIDROOM_COMFYUI_DIR = Join-Path $top 'ComfyUI'
          $env:VIDROOM_COMFYUI_PYTHON = Join-Path $top 'python_embeded\python.exe'
          $env:VIDROOM_COMFYUI_ARGS = '--cpu'
          pnpm exec playwright test --project=comfyui

      - name: No ComfyUI python process left after Host exit (Get-Process)
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          $root = $env:VIDROOM_DATA_DIR
          $left = Get-Process -Name python* -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($root) }
          if ($left) { $left | Format-Table Id, ProcessName, Path; throw "还有 $($left.Count) 个便携包里的 python 进程没退出" }
          Write-Host "OK: 没有 $root 下的 python 进程"
