name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读就够:这一步只拉代码、装依赖、跑测试与构建
permissions:
  contents: read

# 同一个分支连着推只留最后一次,别让旧 run 白烧 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions 一律钉到 commit SHA(标签是可变的,能被上游改指别处)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 单元测试 + 集成用例(自己起假 ComfyUI 的真 HTTP 服务,不需要显卡/ComfyUI/网络)
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
